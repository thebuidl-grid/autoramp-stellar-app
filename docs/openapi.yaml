  /merchants/api/sub-account:
    post:
      operationId: createSubAccount
      summary: Create Sub-Account
      description: Create a new sub-account. Identity fields are required for SafeHaven, ignored for Pulse MFB.
      tags: [Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, emailAddress, externalReference]
              properties:
                phoneNumber:
                  type: string
                  description: Account holder phone number
                emailAddress:
                  type: string
                  description: Account holder email
                externalReference:
                  type: string
                  description: Your unique reference for this sub-account
                identityType:
                  type: string
                  enum: [NIN, vNIN, BVN, BVNUSSD, vID]
                  description: "SafeHaven: required. Pulse MFB: ignored."
                identityNumber:
                  type: string
                  description: The identity number (e.g. BVN or NIN)
                identityId:
                  type: string
                  description: Identity ID from a prior verification
                otp:
                  type: string
                  description: OTP for identity verification. Not required if identityId is provided.
                autoSweep:
                  type: boolean
                  description: "SafeHaven: auto-sweep funds. Pulse MFB: ignored."
            examples:
              safehaven:
                summary: SafeHaven (with identity)
                value:
                  phoneNumber: "08012345678"
                  emailAddress: "user@example.com"
                  externalReference: "ref-123456"
                  identityType: "BVN"
                  identityNumber: "22222222222"
              pulse:
                summary: Pulse MFB (no identity)
                value:
                  phoneNumber: "08012345678"
                  emailAddress: "user@example.com"
                  externalReference: "ref-123456"
      responses:
        '201':
          description: Sub-account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubAccountResponse'
        '400':
          description: Validation error or provider mismatch

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
