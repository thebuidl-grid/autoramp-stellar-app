  /merchants/api/verify-identity:
    post:
      operationId: initiateVerification
      summary: Initiate Identity Verification
      description: Start BVN/NIN verification (SafeHaven only). OTP sent to account holder.
      tags: [Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, number]
              properties:
                type:
                  type: string
                  enum: [BVN, NIN, vNIN, BVNUSSD, CAC, CREDITCHECK]
                  description: Identity type to verify
                number:
                  type: string
                  description: The identity number (e.g. BVN or NIN)
                otp:
                  type: string
                  description: Required only for BVNUSSD type
                verifierId:
                  type: string
                  description: Required only for vNIN type
                provider:
                  type: string
                  description: Required only for CREDITCHECK type
                async:
                  type: boolean
                  description: Async mode for CREDITCHECK type
            examples:
              bvn:
                summary: BVN Verification
                value:
                  type: BVN
                  number: "22222222222"
              nin:
                summary: NIN Verification
                value:
                  type: NIN
                  number: "12345678901"
      responses:
        '201':
          description: Verification initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyIdentityResponse'
        '400':
          description: Provider not supported or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
