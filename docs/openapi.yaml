openapi: "3.0.3"
info:
  title: AutoRamp API
  version: 1.0.0
  description: Fiat-to-crypto on-ramp and off-ramp API for merchants in Nigeria

servers:
  - url: https://api-autoramp.thebuidl.xyz
    description: Production

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Merchant API key

  schemas:
    OnRampRequest:
      type: object
      required: [network, amount, destination]
      properties:
        type:
          type: string
          default: "on"
        network:
          type: string
          description: "base/bsc use the legacy rail. stellar funds a Bitnob NGN virtual account, trades NGN→USDC, then withdraws USDC to the destination address."
          enum: [base, bsc, stellar]
        amount:
          type: number
          minimum: 1000
        destination:
          type: object
          required: [address]
          properties:
            address:
              type: string
              description: "Wallet address that receives the stablecoin. For stellar, a Stellar G... address."

    OffRampRequest:
      type: object
      required: [network, amount, destination]
      properties:
        type:
          type: string
          default: "off"
        network:
          type: string
          description: "base/bsc use the legacy rail. stellar pays out NGN via the Bitnob payouts rail."
          enum: [base, bsc, stellar]
        amount:
          type: number
          minimum: 1000
        sourceAddress:
          type: string
          description: "Required when network is stellar — the Stellar G... wallet that funds the payout."
        destination:
          type: object
          required: [bankCode, accountNumber]
          properties:
            bankCode:
              type: string
            accountNumber:
              type: string

    InitializeSwapRequest:
      type: object
      required: [amount, usdcAmount, slippage, offrampDestination]
      properties:
        amount:
          type: number
        usdcAmount:
          type: number
        slippage:
          type: number
        offrampDestination:
          type: object
          required: [bankCode, accountNumber]
          properties:
            bankCode:
              type: string
            accountNumber:
              type: string
        network:
          type: string
          default: base

    CompleteSwapRequest:
      type: object
      required: [transactionHash, sourceAddress]
      properties:
        transactionHash:
          type: string
        sourceAddress:
          type: string

    CreateSwapRequest:
      type: object
      required: [fromTokenType, toTokenType, fromAmount, toAmount, exchangeRate, sourceAddress, destinationAddress]
      properties:
        fromTokenType:
          type: string
        toTokenType:
          type: string
        fromAmount:
          type: number
        toAmount:
          type: number
        exchangeRate:
          type: number
        sourceAddress:
          type: string
        destinationAddress:
          type: string
        network:
          type: string
        slippage:
          type: number

    TransferRequest:
      type: object
      required: [beneficiary_bank_code, beneficiary_account_number, amount, narration, payment_reference]
      properties:
        beneficiary_bank_code:
          type: string
        beneficiary_account_number:
          type: string
        amount:
          type: number
        narration:
          type: string
        payment_reference:
          type: string
        save_beneficiary:
          type: boolean
        debit_account_number:
          type: string

    NameEnquiryRequest:
      type: object
      required: [bank_code, account_number]
      properties:
        bank_code:
          type: string
        account_number:
          type: string

    VirtualAccountRequest:
      type: object
      required: [amount, external_reference]
      properties:
        amount:
          type: number
        valid_for:
          type: integer
        external_reference:
          type: string
        amount_control:
          type: string
        callback_url:
          type: string

    TransactionResponse:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        amount:
          type: number
        status:
          type: string
        type:
          type: string
        createdAt:
          type: string

    MerchantAccount:
      type: object
      properties:
        accountId:
          type: string
        accountNumber:
          type: string
        bankCode:
          type: string
        accountBalance:
          type: number
        accountName:
          type: string
        status:
          type: string
        fiatProvider:
          type: string

    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          type: string
        error:
          type: string

    TransactionItem:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        amount:
          type: number
        fiatAmount:
          type: number
        tokenAmount:
          type: number
        fromAmount:
          type: number
        toAmount:
          type: number
        fromTokenType:
          type: string
        toTokenType:
          type: string
        exchangeRate:
          type: number
        tokenType:
          type: string
        status:
          type: string
        type:
          type: string
          enum: [onramp, offramp, swap, transfer]
        network:
          type: string
        transactionHash:
          type: string
        destinationAddress:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
        bankName:
          type: string
        currency:
          type: string
        beneficiaryBankCode:
          type: string
        beneficiaryAccountNumber:
          type: string
        beneficiaryAccountName:
          type: string
        narration:
          type: string
        debitAccountNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    TransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer

    TransferFee:
      type: object
      properties:
        id:
          type: string
        feeAmount:
          type: number
        feeType:
          type: string
        feeCurrency:
          type: string

    TransferItem:
      type: object
      properties:
        id:
          type: string
        reference:
          type: string
        amount:
          type: number
        currency:
          type: string
        beneficiaryBankCode:
          type: string
        beneficiaryAccountNumber:
          type: string
        beneficiaryAccountName:
          type: string
        narration:
          type: string
        status:
          type: string
        fees:
          type: array
          items:
            $ref: '#/components/schemas/TransferFee'
        totalFees:
          type: number
        netAmount:
          type: number
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time

    TransferListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TransferItem'
        meta:
          type: object
          properties:
            total:
              type: integer
            page:
              type: integer
            limit:
              type: integer
            totalPages:
              type: integer

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    OnRampResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            transactionId:
              type: string
            depositAccount:
              type: object
              properties:
                accountName:
                  type: string
                accountNumber:
                  type: string
                bankName:
                  type: string
                bankCode:
                  type: string
        deposit:
          type: object
          description: "Stellar on-ramp only: the Bitnob NGN virtual account to fund."
          properties:
            provider:
              type: string
            id:
              type: string
            accountNumber:
              type: string
            accountName:
              type: string
            bankName:
              type: string
            bankCode:
              type: string
        databaseRecord:
          type: object
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            status:
              type: string
            createdAt:
              type: string
              format: date-time
    OffRampResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            transactionId:
              type: string
            depositAddress:
              type: string
        deposit:
          type: object
          description: "Stellar off-ramp only: the USDC funding instructions for the Bitnob payout."
          properties:
            network:
              type: string
            sourceAddress:
              type: string
            receiveAddress:
              type: string
            amount:
              type: string
            memo:
              type: string
            validUntil:
              type: string
        databaseRecord:
          type: object
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            status:
              type: string
            createdAt:
              type: string
              format: date-time
    RampTransactionListResponse:
      type: object
      properties:
        onramp:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        offramp:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        swap:
          type: array
          items:
            $ref: '#/components/schemas/TransactionResponse'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer
    SwapInitializeResponse:
      type: object
      properties:
        swap:
          type: object
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            fromAmount:
              type: number
            toAmount:
              type: number
            exchangeRate:
              type: number
            status:
              type: string
            createdAt:
              type: string
              format: date-time
        offramp:
          type: object
          properties:
            id:
              type: string
              format: uuid
            reference:
              type: string
            status:
              type: string
        recipientAddress:
          type: string
        swapParams:
          type: object
          properties:
            tokenIn:
              type: string
            tokenOut:
              type: string
            amountIn:
              type: string
            recipient:
              type: string
            slippage:
              type: number
    SwapResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        fromTokenType:
          type: string
        fromAmount:
          type: number
        toTokenType:
          type: string
        toAmount:
          type: number
        exchangeRate:
          type: number
        sourceAddress:
          type: string
        destinationAddress:
          type: string
        status:
          type: string
        network:
          type: string
        createdAt:
          type: string
          format: date-time
    MerchantAccountResponse:
      type: object
      properties:
        accountId:
          type: string
        accountNumber:
          type: string
        bankCode:
          type: string
        accountBalance:
          type: number
        bookBalance:
          type: number
        accountName:
          type: string
        status:
          type: string
    TransferResponse:
      type: object
      properties:
        reference:
          type: string
        providerReference:
          type: string
        status:
          type: string
        paymentReference:
          type: string
        amount:
          type: number
        beneficiaryBankCode:
          type: string
        beneficiaryAccountNumber:
          type: string
    NameEnquiryResponse:
      type: object
      properties:
        accountName:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
    SubAccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        safehavenId:
          type: string
        bankCode:
          type: string
        accountNumber:
          type: string
        accountName:
          type: string
        bankName:
          type: string
        accountBalance:
          type: number
        bookBalance:
          type: number
        status:
          type: string
        autoSweep:
          type: boolean
        createdAt:
          type: string
          format: date-time
    VirtualAccountResponse:
      type: object
      properties:
        accountNumber:
          type: string
        bankCode:
          type: string
        expiresAt:
          type: string
          format: date-time
        settlementAccount:
          type: object
          properties:
            bankCode:
              type: string
            accountNumber:
              type: string
    Bank:
      type: object
      properties:
        institutionCode:
          type: string
        institutionName:
          type: string
        bankCode:
          type: string
        name:
          type: string
    RateResponse:
      type: object
      properties:
        rate:
          type: number
    ResolveAccountResponse:
      type: object
      properties:
        accountName:
          type: string
        accountNumber:
          type: string
        bankCode:
          type: string
        bankName:
          type: string
    VerifyIdentityResponse:
      type: object
      properties:
        identityId:
          type: string
        status:
          type: string
        reference:
          type: string
        transferReference:
          type: string
    ValidateIdentityResponse:
      type: object
      properties:
        validated:
          type: boolean
        identityId:
          type: string
    VASService:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: string
    VASCategory:
      type: object
      properties:
        id:
          type: string
        serviceId:
          type: string
        name:
          type: string
        code:
          type: string
    VASProduct:
      type: object
      properties:
        id:
          type: string
        categoryId:
          type: string
        name:
          type: string
        code:
          type: string
        amount:
          type: number
        description:
          type: string
    VASVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
    VASPaymentResponse:
      type: object
      properties:
        transactionId:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
        providerResponse:
          type: object
    VASTransaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        reference:
          type: string
        serviceType:
          type: string
        serviceCategoryId:
          type: string
        bundleCode:
          type: string
        amount:
          type: number
        currency:
          type: string
        channel:
          type: string
        phoneNumber:
          type: string
        cardNumber:
          type: string
        meterNumber:
          type: string
        vendType:
          type: string
        debitAccountNumber:
          type: string
        status:
          type: string
        safehavenId:
          type: string
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    VASTransactionListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VASTransaction'
        pagination:
          $ref: '#/components/schemas/Pagination'
paths:
  /ramp/onramp:
    post:
      operationId: initializeOnramp
      summary: Initialize On-Ramp
      description: Convert Naira to stablecoins
      tags: [On-Ramp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnRampRequest'
            examples:
              default:
                value:
                  type: "on"
                  network: base
                  amount: 50000
                  destination:
                    address: "0x1234567890abcdef1234567890abcdef12345678"
              stellar:
                value:
                  type: "on"
                  network: stellar
                  amount: 50000
                  destination:
                    address: "GXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
      responses:
        '201':
          description: On-ramp initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnRampResponse'
              examples:
                default:
                  value:
                    id: "a1b2c3d4-e5f6-7890-1234-567890abcdef"
                    reference: "ONR-20260628-ABC123"
                    amount: 50000
                    status: "INITIALIZED"
                    type: "onramp"
                    createdAt: "2026-06-28T10:00:00.000Z"
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ramp/offramp:
    post:
      operationId: initializeOfframp
      summary: Initialize Off-Ramp
      description: Convert stablecoins to Naira
      tags: [Off-Ramp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OffRampRequest'
            examples:
              default:
                value:
                  type: "off"
                  network: base
                  amount: 50000
                  destination:
                    bankCode: "058"
                    accountNumber: "0123456789"
              stellar:
                value:
                  type: "off"
                  network: stellar
                  amount: 50000
                  sourceAddress: "GXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
                  destination:
                    bankCode: "058"
                    accountNumber: "0123456789"
      responses:
        '201':
          description: Off-ramp initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OffRampResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /ramp/transactions:
    get:
      operationId: getRampTransactions
      summary: Get Transactions
      description: Get onramp and offramp transaction history
      tags: [On-Ramp, Off-Ramp]
      parameters:
        - name: id
          in: query
          schema:
            type: string
        - name: reference
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Transaction list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RampTransactionListResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /swap/initialize:
    post:
      operationId: initializeSwap
      summary: Initialize Swap
      description: Initialize USDC to CNGN swap
      tags: [Swap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitializeSwapRequest'
            examples:
              default:
                value:
                  amount: 140196
                  usdcAmount: 100
                  slippage: 0.05
                  offrampDestination:
                    bankCode: "058"
                    accountNumber: "1234567890"
                  network: base
      responses:
        '200':
          description: Swap initialized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapInitializeResponse'
        '400':
          description: Validation error

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /swap/{reference}/complete:
    post:
      operationId: completeSwap
      summary: Complete Swap
      description: Confirm swap after on-chain execution
      tags: [Swap]
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteSwapRequest'
            examples:
              default:
                value:
                  transactionHash: "0xabc123..."
                  sourceAddress: "0x1234567890abcdef1234567890abcdef12345678"
      responses:
        '200':
          description: Swap completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Swap not found

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /swap/create:
    post:
      operationId: createSwap
      summary: Create Swap
      description: Record swap transaction
      tags: [Swap]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSwapRequest'
      responses:
        '200':
          description: Swap created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResponse'
        '400':
          description: Validation error

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchants/api/account:
    get:
      operationId: getMerchantAccount
      summary: Get Account
      description: Get merchant bank account balance
      tags: [Merchant]
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantAccountResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not verified

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchants/api/transfer:
    post:
      operationId: merchantTransfer
      summary: Transfer
      description: Initiate bank transfer
      tags: [Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferRequest'
            examples:
              default:
                value:
                  beneficiary_bank_code: "090286"
                  beneficiary_account_number: "0123456789"
                  amount: 5000
                  narration: "Payment for services"
                  payment_reference: "ref-123456"
      responses:
        '201':
          description: Transfer initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Insufficient funds

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Merchant not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /merchants/api/name-enquiry:
    post:
      operationId: nameEnquiry
      summary: Name Enquiry
      description: Validate bank account and resolve name
      tags: [Merchant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
