allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  bufferutil: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  utf-8-validate: true

# Security: force patched versions of transitive dependencies (same major only).
overrides:
  'proxy-addr@<2.0.8': '^2.0.8'
  'socket.io-parser@<4.2.7': '^4.2.7'
  'engine.io@<6.6.10': '^6.6.10'
  'lodash@<4.18.1': '^4.18.1'
  'defu@<6.1.5': '^6.1.5'
  'body-parser@>=2.0.0 <2.4.0': '^2.4.0'
  'ws@>=8.0.0 <8.21.0': '^8.21.0'
  'zod@>=4.0.0 <4.6.6': '^4.6.6'
  'qs@<6.16.1': '^6.16.1'
